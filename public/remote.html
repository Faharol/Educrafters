<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Remote · ETC Lab</title>
<style>
  :root { --bg: #000; --card: #161618; --card2: #232326; --text: #f5f5f7; --muted: #8e8e93; --blue: #2997ff; --mint: #30d158; --red: #ff453a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); min-height: 100vh; user-select: none; -webkit-user-select: none; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .brand { font-weight: 700; letter-spacing: -.02em; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .dot.on { background: var(--mint); box-shadow: 0 0 0 4px rgba(48, 209, 88, .2); }
  .now { background: var(--card); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .now small { color: var(--muted); display: block; font-size: .78rem; }
  .now b { display: block; font-size: 1.05rem; margin-top: 2px; }
  .now .sec { color: var(--blue); font-weight: 600; margin-top: 4px; font-size: .95rem; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  button { font: inherit; color: var(--text); background: var(--card); border: 0; border-radius: 18px; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); background: var(--card2); }
  .big button { height: 128px; font-size: 1.15rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .big button span { font-size: 2.2rem; line-height: 1; }
  .big .nx { background: var(--blue); color: #fff; }
  .row { display: grid; gap: 8px; margin-bottom: 10px; }
  .r2 { grid-template-columns: 1fr 1fr; } .r3 { grid-template-columns: repeat(3, 1fr); } .r4 { grid-template-columns: repeat(4, 1fr); } .r6 { grid-template-columns: repeat(6, 1fr); }
  .row button { min-height: 52px; font-size: .92rem; font-weight: 600; padding: 8px 4px; }
  .emo button { font-size: 1.7rem; min-height: 56px; }
  h4 { margin: 16px 2px 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .on-state { background: var(--mint) !important; color: #000 !important; }
  .list { background: var(--card); border-radius: 18px; overflow: hidden; }
  .list button { display: block; width: 100%; text-align: left; border-radius: 0; padding: 12px 16px; border-bottom: 1px solid #222; font-size: .92rem; min-height: 46px; }
  .list button.cur { color: var(--blue); font-weight: 700; }
  select { width: 100%; font: inherit; color: var(--text); background: var(--card); border: 0; border-radius: 14px; padding: 14px; min-height: 52px; }
  .gate { max-width: 420px; margin: 12vh auto 0; text-align: center; }
  .gate input { width: 100%; font: inherit; font-size: 1.1rem; padding: 14px; border-radius: 14px; border: 1px solid #333; background: var(--card); color: var(--text); margin: 14px 0 10px; text-align: center; }
  .gate button { background: var(--blue); color: #fff; padding: 14px 24px; font-weight: 700; width: 100%; }
  .muted { color: var(--muted); font-size: .9rem; }
  .err { color: var(--red); min-height: 1.4em; font-size: .9rem; }
  .flash { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #2c2c2e; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .flash.show { opacity: 1; }
  .end { background: transparent; color: var(--muted); font-size: .85rem; padding: 8px 10px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="flash" id="flash"></div>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var ID = (location.hash || "").replace(/^#/, "").trim();
  var KEYS = "etc-remote-key";
  function $(s) { return app.querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function key() {
    try { var k = localStorage.getItem(KEYS); if (k) return k; } catch (e) {}
    try { var s = sessionStorage.getItem("etc_admin"); if (s) return s; } catch (e) {}
    var m = document.cookie.match(/(?:^|;\s*)etc_admin=([^;]*)/); try { return m ? decodeURIComponent(m[1]) : ""; } catch (e) { return ""; }
  }
  function flash(t) { var f = document.getElementById("flash"); f.textContent = t; f.classList.add("show"); clearTimeout(flash.t); flash.t = setTimeout(function () { f.classList.remove("show"); }, 1200); }
  function api(method, q, body) {
    return fetch("/api/remote" + (q || ""), { method: method, cache: "no-store", headers: Object.assign({ "x-admin-key": key() }, body ? { "content-type": "application/json" } : {}), body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) { var e = new Error(d.error || "Error " + r.status); e.status = r.status; throw e; } return d; }); });
  }

  if (!/^[a-z0-9]{10}$/.test(ID)) {
    app.innerHTML = '<div class="gate"><div style="font-size:3rem">📱</div><h2>ETC Lab remote</h2><p class="muted">On the computer, sign in as lecturer, open a page and tap <b>📱 Remote</b>. Then scan the QR code with this phone.</p></div>';
    return;
  }

  function gate(msg) {
    app.innerHTML = '<div class="gate"><div style="font-size:3rem">🔒</div><h2>Lecturer only</h2><p class="muted">Enter the admin password once. This phone will remember it.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Admin password"><div class="err" id="err">' + esc(msg || "") + '</div><button id="go" type="button">Connect</button></div>';
    var go = function () {
      var pw = $("#pw").value.trim(); if (!pw) return;
      fetch("/api/admin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ action: "login", password: pw }) }).then(function (r) {
        if (!r.ok) { $("#err").textContent = "Wrong password."; return; }
        try { localStorage.setItem(KEYS, pw); } catch (e) {}
        connect();
      }).catch(function () { $("#err").textContent = "No connection. Try again."; });
    };
    $("#go").addEventListener("click", go);
    $("#pw").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
    $("#pw").focus();
  }

  var ST = null, busy = false;
  function send(cmd, arg) {
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
    return api("POST", "", { action: "cmd", id: ID, cmd: cmd, arg: arg == null ? "" : String(arg) }).catch(function (e) {
      if (e.status === 401) { try { localStorage.removeItem(KEYS); } catch (x) {} gate("The password changed. Enter it again."); }
      else if (e.status === 404) ended(); else flash("Not sent. Check the connection.");
    });
  }
  function ended() { app.innerHTML = '<div class="gate"><div style="font-size:3rem">⏹</div><h2>Remote ended</h2><p class="muted">Start a new remote on the computer and scan the new QR code.</p></div>'; ST = "ended"; }

  function render() {
    var s = ST && ST !== "ended" ? ST : null;
    var secs = s && s.sections ? s.sections : [];
    var weekOpts = ""; for (var n = 1; n <= 14; n++) { var w = String(n).padStart(2, "0"); weekOpts += '<option value="' + n + '"' + (s && s.week === w ? " selected" : "") + ">Week " + n + "</option>"; }
    app.innerHTML =
      '<div class="top"><div class="brand"><span class="dot on"></span>ETC Lab remote</div><button class="end" id="end" type="button">End</button></div>' +
      '<div class="now"><small>On screen</small><b>' + esc(s ? s.title : "Connecting…") + '</b><div class="sec">' + (secs.length ? (s.cur + 1) + " / " + secs.length + " · " + esc(secs[s.cur] || "") : "") + "</div></div>" +
      '<div class="big"><button type="button" data-c="prev"><span>⬆</span>Previous</button><button type="button" class="nx" data-c="next"><span>⬇</span>Next</button></div>' +
      '<div class="row r3"><button type="button" data-c="up">▲ Scroll</button><button type="button" data-c="down">▼ Scroll</button><button type="button" data-c="top">⤒ Top</button></div>' +
      "<h4>React on screen</h4>" +
      '<div class="row r6 emo">' + ["👏", "🔥", "😂", "✅", "❤️", "🎉"].map(function (e) { return '<button type="button" data-c="react" data-a="' + e + '">' + e + "</button>"; }).join("") + "</div>" +
      "<h4>Teaching tools</h4>" +
      '<div class="row r2"><button type="button" data-c="answers">💡 Show answers</button><button type="button" data-c="black" class="' + (s && s.black ? "on-state" : "") + '">⬛ Blank screen</button><button type="button" data-c="qr">📲 Student QR</button><button type="button" data-c="wall">🧱 Class Wall</button></div>' +
      '<div class="row r4"><button type="button" data-c="timer" data-a="60">1 min</button><button type="button" data-c="timer" data-a="180">3 min</button><button type="button" data-c="timer" data-a="300">5 min</button><button type="button" data-c="timer" data-a="0">Stop</button></div>' +
      '<div class="row r2"><button type="button" data-c="clear">✖ Clear screen</button><button type="button" data-c="home">🏠 Home page</button></div>' +
      "<h4>Go to week</h4>" +
      '<select id="wk">' + weekOpts + "</select>" +
      (secs.length ? "<h4>Sections on this page</h4><div class=\"list\">" + secs.map(function (t, i) { return '<button type="button" data-c="goto" data-a="' + i + '" class="' + (i === s.cur ? "cur" : "") + '">' + (i + 1) + ". " + esc(t) + "</button>"; }).join("") + "</div>" : "");
    $("#end").addEventListener("click", function () { if (confirm("End the remote for this class?")) api("POST", "", { action: "end", id: ID }).then(ended, ended); });
    $("#wk").addEventListener("change", function () { send("week", this.value); flash("Opening Week " + this.value); });
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-c]"); if (!b) return;
    var c = b.getAttribute("data-c"), a = b.getAttribute("data-a");
    send(c, a);
    if (c === "react") flash(a); else if (c === "timer") flash(a === "0" ? "Timer stopped" : "Timer " + (a / 60) + " min");
    setTimeout(refresh, 1300);
  });

  var lastKey = "";
  function refresh() {
    if (busy || ST === "ended" || document.hidden) return; busy = true;
    api("GET", "?state=" + ID).then(function (d) {
      busy = false; var k = JSON.stringify(d.state || {});
      if (k !== lastKey) { lastKey = k; var y = window.scrollY; ST = d.state || {}; render(); window.scrollTo(0, y); }
    }).catch(function (e) { busy = false; if (e.status === 404) ended(); else if (e.status === 401) gate("Enter the admin password."); });
  }
  function connect() {
    ST = {}; render();
    send("hello").then(function () { flash("Connected"); refresh(); });
  }
  setInterval(refresh, 2500);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
  if (!key()) gate(); else connect();
})();
</script>
</body>
</html>
