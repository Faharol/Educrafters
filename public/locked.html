<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not open yet · ETC Lab</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23000'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial,sans-serif' font-weight='800' font-size='30' text-anchor='middle' fill='%232997FF'%3EE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/lab.css">
<style>
  body.lab-locked { background: var(--black); color: var(--dk-text); }
  .lockwrap { min-height: calc(100vh - 48px); display: grid; place-items: center; padding: 24px 16px; }
  .lockcard { max-width: 640px; width: 100%; background: var(--dk); border-radius: var(--r); padding: clamp(28px, 5vw, 48px); display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; text-align: center; align-items: center; }
  .lockcard::before { content: ""; position: absolute; width: 420px; height: 420px; right: -160px; top: -180px; border-radius: 50%; background: var(--glow); background-size: 300% 100%; animation: shine 8s linear infinite; filter: blur(80px); opacity: .5; }
  .lockcard > * { position: relative; }
  .lockcard h1 { color: #fff; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -.04em; margin: 0; }
  .cd { display: flex; gap: 10px; justify-content: center; }
  .cd div { background: var(--dk-2); border-radius: 16px; padding: 12px 10px; min-width: 70px; }
  .cd b { display: block; font: 800 2rem/1 var(--font-display); letter-spacing: -.04em; }
  .cd span { font-size: .72rem; color: var(--dk-muted); text-transform: uppercase; letter-spacing: .08em; }
</style>
</head>
<body class="lab-locked" data-root="">
<main id="main"><div class="lockwrap"><section class="lockcard" id="card"></section></div></main>
<script src="assets/js/course.js"></script>
<script src="assets/js/hooks.js"></script>
<script src="assets/js/lab.js"></script>
<script>
(function () {
  var L = window.LAB, $ = L.$, esc = L.esc, C = window.COURSE;
  L.nav("locked", L.totalXp());
  var wk = (new URLSearchParams(location.search).get("week") || "").replace(/\D/g, "").slice(0, 2);
  var n = parseInt(wk, 10) || 0;
  var w = C.weeks.filter(function (x) { return x.n === n; })[0];
  var card = $("#card");
  if (!w) { card.innerHTML = '<h1>Nothing here.</h1><a class="lbtn" href="index.html">Back to ETC Lab</a>'; return; }
  var hk = (window.HOOKS || {})[n] || {};
  function render(unlock, override) {
    var left = unlock - Date.now();
    var d = Math.max(0, Math.floor(left / 86400000)), h = Math.max(0, Math.floor(left % 86400000 / 3600000)), m = Math.max(0, Math.floor(left % 3600000 / 60000));
    card.innerHTML = '<p class="eyebrow">Week ' + n + ' · ' + esc(w.title) + '</p><h1>' + L.words("Not open yet.") + '</h1>' +
      '<p class="lede" style="text-align:center">' + (override === "locked" ? "Your lecturer has locked this week for now." : "Each week opens two days before it starts, at midnight on " + fmt(unlock) + ".") + "</p>" +
      (override !== "locked" && left > 0 ? '<div class="cd"><div><b>' + d + '</b><span>days</span></div><div><b>' + h + '</b><span>hours</span></div><div><b>' + m + '</b><span>min</span></div></div>' : "") +
      (hk.head ? '<p class="muted" style="color:var(--dk-muted);margin:6px 0 0">Coming up: ' + esc(hk.head) + '</p>' : "") +
      '<div class="lchips" style="justify-content:center;margin-top:8px"><a class="lbtn" href="index.html">Back to ETC Lab</a><a class="lchip" href="wall.html" style="background:transparent;color:#fff;border-color:var(--dk-line)">Class Wall</a></div>';
  }
  function fmt(ts) { var d = new Date(ts + 8 * 3600000); var M = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]; return d.getUTCDate() + " " + M[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  var local = L.unlockTs("w" + wk);
  render(local, null);
  fetch("/api/admin?reveal").then(function (r) { return r.json(); }).then(function (d) { var x = d.weeks && d.weeks["w" + wk]; if (!x) return; if (x.open) { location.replace("weeks/week-" + wk + ".html"); return; } render(x.unlock, x.override); }).catch(function () {});
  L.setupMotion(document); $("#main").classList.add("enter");
})();
</script>
</body>
</html>
